<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6a46">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Cahier de Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout : appli mobile d'abord — en-tête, une vue à la fois, barre d'onglets en bas ; colonne centrée sur ordinateur */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --sunk:#e8ece2; --line:#d5dbcc;
  --ink:#18211b; --muted:#5b6758;
  --accent:#1d6a46; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --gold:#b87d00; --gold-soft:#f6ebcf;
  --good:#1d6a46; --bad:#b3261e; --bad-soft:#f7dedb; --warn:#a15c00; --warn-soft:#f8e7cc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#1a211c; --sunk:#232c25; --line:#334036;
  --ink:#e8eee6; --muted:#9daa9b;
  --accent:#5cc28d; --accent-ink:#0d1a12; --accent-soft:#1f3a2a;
  --gold:#e3b23c; --gold-soft:#3a2f14;
  --good:#5cc28d; --bad:#ff8a80; --bad-soft:#3d1f1c; --warn:#f0b35a; --warn-soft:#3a2a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1a211c; --sunk:#232c25; --line:#334036;
  --ink:#e8eee6; --muted:#9daa9b;
  --accent:#5cc28d; --accent-ink:#0d1a12; --accent-soft:#1f3a2a;
  --gold:#e3b23c; --gold-soft:#3a2f14;
  --good:#5cc28d; --bad:#ff8a80; --bad-soft:#3d1f1c; --warn:#f0b35a; --warn-soft:#3a2a12;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.top-t{min-width:0;flex:1}
.top-t h1{font-size:1.2rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="saved"] i{background:var(--good)}
.status[data-s="saving"] i{background:var(--gold)}
.status[data-s="error"] i{background:var(--bad)}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.62rem;color:var(--muted);font-weight:700;border-top:3px solid transparent;white-space:nowrap;padding-inline:2px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.view{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Barres de navigation date / mois */
.nav{display:flex;align-items:center;gap:8px}
.nav h2{flex:1;font-size:1.35rem;font-weight:700;text-align:center;text-transform:capitalize}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.datepick{display:flex;justify-content:center}
.datepick input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.9rem;color:var(--muted)}

/* Bandeau de chiffres */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip>div{padding:12px 12px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip .k{font-size:.78rem;color:var(--muted)}
.strip .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lignes produit (saisie du jour) */
.plist{display:flex;flex-direction:column;gap:10px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pl.err{border-color:var(--bad)}
.pl.has{border-left:4px solid var(--accent)}
.pl-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.pl-n{font-weight:700;font-size:1.05rem;min-width:0}
.pl-d{font-size:.85rem;color:var(--muted);white-space:nowrap}
.pl-d b{font-family:var(--f-num);color:var(--ink)}
.pl-d.low b{color:var(--warn)}
.pl-f{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
.in{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;
  font-family:var(--f-num);font-size:1.1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.in.txt{font-family:var(--f-body);font-size:1rem}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.step{display:flex;gap:6px}
.step .in{text-align:center;flex:1;min-width:0}
.pl>.pl-f{grid-template-columns:1.35fr 1fr}
@media (max-width:380px){.pl .sb{width:40px}}
.sb{width:46px;height:46px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:1.4rem;font-weight:700;line-height:1}
.pl-c{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--muted)}
.pl-c b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.msg{margin:0;font-size:.88rem;padding:8px 10px;border-radius:8px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}

/* Boutons */
.btn{height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Panneau (cartes simples) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:1.05rem;font-weight:700;margin-bottom:10px}

/* Charges */
.chg{display:flex;flex-direction:column}
.chg-r{display:grid;grid-template-columns:1fr 150px 32px;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.chg-r:last-child{border-bottom:0}
.chg-r label,.chg-r .lab{font-weight:700;min-width:0}
.chg-r .lab .hint{display:block;font-weight:400}
.chg-r .auto{text-align:right;font-weight:600;padding-right:12px}
.chg-r.sub{padding-block:4px;font-size:.88rem;color:var(--muted);padding-left:14px;border-bottom:0}
.chg-r .in{text-align:right;height:42px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.2rem}
.x:hover{background:var(--sunk)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:2px solid var(--ink);font-weight:700}
.total .num{font-size:1.2rem}

/* Bilan */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.result.pos{border-top:5px solid var(--good)}
.result.neg{border-top:5px solid var(--bad)}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.chip.pos{background:var(--accent-soft);color:var(--good)}
.chip.neg{background:var(--bad-soft);color:var(--bad)}
.chip.mid{background:var(--sunk);color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.45em;font-weight:700;color:var(--muted);margin-left:4px}
.result.pos .big{color:var(--good)} .result.neg .big{color:var(--bad)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:end;font-size:.8rem;color:var(--muted)}
.eq b{display:block;font-family:var(--f-num);font-size:.98rem;color:var(--ink);font-weight:600;white-space:nowrap}
.eq .op{font-family:var(--f-num);font-size:1.1rem;color:var(--muted);padding-bottom:2px}
.eq>div{min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-num);font-weight:600}

.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:820px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);font-weight:700}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td:nth-child(2){font-family:var(--f-body);font-weight:700}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
td.neg{color:var(--bad)} td.low{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar.today{fill:var(--gold)}
.chart .bar.neg{fill:var(--bad)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}

.alerts{display:flex;flex-direction:column;gap:6px}
.alerts li{list-style:none}
.alerts ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

/* Produits */
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border-bottom:0}
.prod .n{font-weight:700}
.prod .m{font-size:.85rem;color:var(--muted);grid-column:1}
.prod .m b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.prod .s{grid-row:1/3;grid-column:2;text-align:right}
.prod .s b{display:block;font-family:var(--f-num);font-size:1.2rem}
.prod .s span{font-size:.75rem;color:var(--muted)}
.prod .s.low b{color:var(--warn)} .prod .s.zero b{color:var(--bad)}
.prod .acts{grid-column:1/-1;display:flex;gap:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.hint{font-size:.82rem;color:var(--muted);font-weight:400}

.empty{text-align:center;padding:28px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.demo{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}

.licbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--line)}
.licbar b{color:var(--ink)}
.licbar.essai{background:var(--gold-soft);margin-inline:-16px;padding-inline:16px;color:var(--ink)}
.licbar.expire{background:var(--bad-soft);margin-inline:-16px;padding-inline:16px;color:var(--bad)}
.licbar .lnk{font-size:.9rem}
.code{font-family:var(--f-num);font-size:1.6rem;font-weight:600;letter-spacing:.08em;background:var(--sunk);border-radius:8px;padding:10px 14px;display:inline-block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
textarea.in{height:auto;min-height:90px;padding:10px 12px;font-size:.85rem;resize:vertical;overflow-wrap:anywhere}
.locked-note{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.install{border:2px solid var(--accent);gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.fiche-h{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.fiche-h h2{font-size:1.5rem;font-weight:800}
.fiche-t{font-size:1rem;font-weight:700;margin-bottom:8px}
.fiche .result{padding:14px 0 0;border:0;border-top:5px solid var(--line);border-radius:0;background:none}
.fiche .result.pos{border-top-color:var(--good)} .fiche .result.neg{border-top-color:var(--bad)}
.fiche-2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:700px){.fiche-2{grid-template-columns:1.2fr 1fr}}
table.t-syn{min-width:560px}
table.t-syn.t-small{min-width:420px}
table.t-syn td:nth-child(2){font-family:var(--f-num);font-weight:400}
table.t-syn td:first-child{font-family:var(--f-body);font-weight:700}
table.t-syn th:nth-child(2),table.t-syn td:nth-child(2){text-align:right}
.fiche-2>div,.fiche>div{min-width:0}
.print-only{display:none!important}
.cs-ov{position:fixed;inset:0;z-index:30;background:rgba(10,16,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:620px){.cs-ov{align-items:center}}
.cs{background:var(--surface);color:var(--ink);border-radius:16px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.cs-top{display:flex;justify-content:space-between;align-items:center}
.cs-i{font-size:3.2rem;line-height:1;text-align:center}
.cs h2{font-size:1.35rem;text-align:center}
.cs>p{margin:0;text-align:center}
.cs-ecoute{min-height:56px;font-size:1.1rem}
.cs-al{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cs-al .msg{margin:0}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.cs-nav{justify-content:space-between;font-size:.88rem}
.cs-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cs-btn span:nth-child(2){flex:1}
.cs-n{color:var(--bad);font-weight:700}
.ratio .chip.mid{background:var(--warn-soft);color:var(--warn)}
@media print{#conseil{display:none!important}}
.rgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.rgrid{grid-template-columns:1fr 1fr}}
.ratio{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.ratio.pos{border-left-color:var(--good)} .ratio.mid{border-left-color:var(--warn)} .ratio.neg{border-left-color:var(--bad)}
.ratio-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ratio-n{font-weight:700;font-size:.92rem}
.ratio-v{font-size:1.45rem;font-weight:600;line-height:1.1}
.ratio-p{margin:0;font-size:.9rem}
.ratio-c{margin:0;font-size:.78rem;color:var(--muted)}
.top5{margin:2px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.top5 li span:first-child{font-weight:700}
.top5 li{font-size:.9rem}.top5 li .num{margin-left:8px}.top5 li .hint{margin-left:6px}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#eef1ea;--line:#c9d0c2;--ink:#000;--muted:#444;--accent:#1d6a46;--good:#1d6a46;--bad:#b3261e;--bad-soft:#f7dedb;--accent-soft:#dcebe1;color-scheme:light}
  @page{size:A4;margin:10mm}
  tr.vide{display:none}
  html,body{background:#fff!important}
  body{padding:0!important;font-size:10pt}
  .top,.tabs,.licbar,.toast,.no-print,.view>*:not(.fiche){display:none!important}
  .view{padding:0;gap:0}
  .view>.print-only{display:flex!important}
  .print-only table.t-cr{min-width:0!important;width:100%}
  .fiche{border:0;padding:0;gap:12px}
  .tbl-w{overflow:visible;border:1px solid var(--line)}
  table,table.t-syn,table.t-syn.t-small{min-width:0;font-size:9pt}
  th,td{padding:2px 6px}
  .chart svg{max-height:3.2cm;width:auto;max-width:100%}
  .chart .legend{display:none}
  .chg-r{padding-block:2px;font-size:9pt}
  .chg-r.sub{padding-block:0;font-size:8.5pt}
  .total{padding-top:4px}
  .fiche .facts{font-size:9pt;gap:2px 14px}
  .fiche-t{margin-bottom:4px;font-size:10.5pt}
  .fiche .result{gap:6px;padding-top:8px}
  .fiche-2{grid-template-columns:1.5fr 1fr;gap:14px}
  table.t-small{font-size:8pt}
  table.t-small th,table.t-small td{padding:2px 4px}
  table.t-small td:first-child,table.t-small th{white-space:normal}
  .big{font-size:20pt}
  .fiche section,.fiche table,.chart{break-inside:avoid}
}

<script>
(function(){
"use strict";
/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const addDay = (d,k) => { const x = new Date(d+'T12:00:00'); x.setDate(x.getDate()+k); return iso(x); };
const addMonth = (m,k) => { let [y,mm] = m.split('-').map(Number); mm += k; while(mm>12){mm-=12;y++} while(mm<1){mm+=12;y--} return y+'-'+pad(mm); };
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const libMois = m => { const [y,mm] = m.split('-'); return MOIS[+mm-1]+' '+y; };
const libJour = d => new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const court = d => d.slice(8,10)+'/'+d.slice(5,7);
const nbJours = m => { const [y,mm] = m.split('-').map(Number); return new Date(y,mm,0).getDate(); };
const fmt = n => Math.round(n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ');
const F = n => fmt(n)+' F';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const int = v => { const n = parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n)||n<0 ? 0 : n; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const PUB = '_scxpzSUBJYGclwy0NwUrz6XBd-Z1uqZ4cA3jYYJqwk';
let LIC = (function(){
  try { const u = new URL(location.href), raw = u.searchParams.get('l');
    if (raw) { const s = raw.replace(/-/g,'+').replace(/_/g,'/'); const bin = atob(s + '==='.slice((s.length+3)%4)); const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
      if (o && o.d && o.s) localStorage.setItem('cb-lic-new', JSON.stringify(o)); history.replaceState(null, '', location.pathname); }
  } catch(e){}
  try { return JSON.parse(localStorage.getItem('cb-lic') || 'null'); } catch(e){ return null; }
})();
let SERIAL = LIC ? LIC.d.serial : 'DEV';
let LK = 'cahier-boutique-' + SERIAL;

const DEF_CHARGES = ['Loyer du magasin','Électricité','Téléphone','Salaire du personnel',"Salaire de l'entrepreneur",'Impôt / Mairie','Publicité et communication','Transport'];
const DEF_QUOT = [['Ticket de marché / taxe du jour'],['Emballages (sachets, papier)'],['Manutention / porteur'],['Eau'],['Carburant'],['Petites fournitures'],['Autres petites dépenses']];
const QUOT_NOMS = /^(téléphone|transport)$/i;
const estLoyer = c => !!c && !c.salaire && (c.mensuel || /loyer/i.test(c.nom));
const DEF_PERSO = ['Nourriture de la famille','Loyer de la maison','Scolarité des enfants','Santé','Transport personnel','Eau et électricité (maison)','Téléphone personnel','Habillement','Autres dépenses'];
const defaultBoutique = () => ({ nom:'Ma boutique', produits:[], charges: DEF_CHARGES.concat(DEF_QUOT.map(x=>x[0])).map((n,i)=>({id:'c'+(i+1), nom:n, salaire: i===4 || undefined, mensuel: /loyer/i.test(n) || undefined, quotidien: (i!==4 && !/loyer/i.test(n)) || undefined})), perso: DEF_PERSO.map((n,i)=>({id:'d'+(i+1), nom:n})), exemple:false });
/* Met à niveau les données enregistrées avant l'ajout des dépenses personnelles */
function migrate(){
  if (!S.credits || !Array.isArray(S.credits.tiers)) S.credits = {tiers:[], dettes:[]};
  if (!Array.isArray(S.credits.dettes)) { const dettes = [];
    const ops = (S.credits.ops||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
    ops.filter(o=>o.type==='du').forEach(o => dettes.push({id:o.id, ts:o.ts, tiers:o.tiers, date:o.date, m:o.m, ref:o.note||'', ech:o.ech||'', note:'', sig:'', paiements:[]}));
    ops.filter(o=>o.type==='paye').forEach(o => { let r = o.m; dettes.filter(d=>d.tiers===o.tiers).forEach(d => { const rest = d.m - d.paiements.reduce((a,p)=>a+p.m,0); const x = Math.min(r, rest); if (x>0) { d.paiements.push({id:o.id+'-'+d.id, date:o.date, m:x}); r -= x; } }); });
    S.credits = {tiers:S.credits.tiers, dettes}; }
  S.credits.dettes.forEach(d => { if (!d.kind) d.kind = 'autre'; });
  const b = S.boutique;
  if (!Array.isArray(b.perso)) b.perso = DEF_PERSO.map((n,i)=>({id:'d'+(i+1), nom:n}));
  let sal = b.charges.find(c=>c.salaire) || b.charges.find(c=>/salaire.*entrepreneur/i.test(c.nom));
  if (!sal) { sal = {id:'c5', nom:"Salaire de l'entrepreneur"}; b.charges.push(sal); }
  sal.salaire = true;
  b.charges.forEach(c => { if (c.salaire) return; if (estLoyer(c)) { c.mensuel = true; delete c.quotidien; } else c.quotidien = true; });
  Object.keys(S.mois).forEach(mk => { const M = S.mois[mk]; if (!M.charges) return;
    Object.keys(M.charges).forEach(id => { const x = M.charges[id]; if (x && x.m) { M.depj = M.depj || {}; const d = mk+'-01'; (M.depj[d] = M.depj[d] || []).push({id:'f'+mk.replace('-','')+id, cid:id, cnom:x.n || (b.charges.find(c=>c.id===id)||{}).nom || 'Charge', m:x.m, note:'Montant du mois (repris)', loyer: estLoyer(b.charges.find(c=>c.id===id)) || undefined}); } });
    M.charges = {}; });
  if (!b.quotInit) { DEF_QUOT.forEach(([n]) => { if (!b.charges.some(c => c.nom===n)) b.charges.push({id:uid('c'), nom:n, quotidien:true}); }); b.quotInit = true; }
  b.produits.forEach(p => { if (!p.u) p.u = /\(kg\)|\bkg\b/i.test(p.nom) ? 'kg' : /litre|\(l\)/i.test(p.nom) ? 'L' : /boîte/i.test(p.nom) ? 'boîte' : 'pièce'; });
  Object.values(S.mois).forEach(M => {
    M.charges = M.charges || {}; M.perso = M.perso || {};
    const c = M.charges[sal.id];
    if (c) { if (c.m && !Object.keys(M.perso).length) M.perso.dg = {n:'Montant global (à détailler)', m:c.m}; delete M.charges[sal.id]; }
  });
}

/* ---------- État ---------- */
let S = { boutique: defaultBoutique(), mois:{}, credits:{tiers:[], dettes:[]} };
const U = { syn:{p:'annee'}, tab:'jour', date: today(), mois: today().slice(0,7), edit:null, confirm:null, showArch:false };
try { const t = localStorage.getItem(LK+'-tab'); if (t) U.tab = t; } catch(e){}

const getM = m => S.mois[m] || {jours:{}, charges:{}, perso:{}};
const useM = m => { const M = S.mois[m] || (S.mois[m] = {jours:{}, charges:{}, perso:{}}); M.perso = M.perso || {}; return M; };
const prod = id => S.boutique.produits.find(p=>p.id===id);
const actifs = () => S.boutique.produits.filter(p=>p.actif!==false);

function datesTriees(){
  const out = [];
  Object.keys(S.mois).forEach(m => Object.keys(S.mois[m].jours||{}).forEach(d => out.push(d)));
  return out.sort();
}
function ligne(d, pid){ const m = S.mois[d.slice(0,7)]; return m && m.jours[d] && m.jours[d][pid]; }
/* Stock disponible au début du jour d (avant entrées et ventes de ce jour) */
function stockAvant(pid, d){
  const p = prod(pid); if(!p) return 0;
  let s = p.si||0;
  for (const x of datesTriees()){ if (x >= d) break; const l = ligne(x,pid); if (l) s += (l.e||0) - (l.v||0); }
  return s;
}
const stockActuel = pid => stockAvant(pid, '9999-99-99');
function premierNegatif(pid){
  const p = prod(pid); let s = p.si||0;
  for (const x of datesTriees()){ const l = ligne(x,pid); if(!l) continue; s += (l.e||0)-(l.v||0); if (s<0) return x; }
  return null;
}
const aDesMouvements = pid => datesTriees().some(d => ligne(d,pid));

function chargesDuMois(m){
  const mc = getM(m).charges || {};
  const list = S.boutique.charges.map(c => c.salaire ? {id:c.id, nom:c.nom, m:salaireDuMois(m), auto:true} : ({id:c.id, nom:c.nom, m:(mc[c.id]&&mc[c.id].m)||0}));
  Object.keys(mc).forEach(id => { if (!S.boutique.charges.some(c=>c.id===id)) list.push({id, nom:mc[id].n, m:mc[id].m||0, ancien:true}); });
  const dj = depJourMois(m);
  Object.keys(dj).forEach(id => { let x = list.find(c => c.id===id); if (!x) { x = {id, nom:dj[id].nom, m:0, ancien:true}; list.push(x); } x.jour = dj[id].m; x.nj = dj[id].n; x.m += dj[id].m; });
  const cc = chargesCredit(m);
  Object.keys(cc).forEach(id => { let x = list.find(c => c.id===id); if (!x) { x = {id, nom:cc[id].nom, m:0, ancien:true}; list.push(x); } x.credit = cc[id].m; x.m += cc[id].m; });
  return list;
}

function persoDuMois(m){
  const mp = getM(m).perso || {};
  const list = S.boutique.perso.map(d => ({id:d.id, nom:d.nom, m:(mp[d.id]&&mp[d.id].m)||0}));
  Object.keys(mp).forEach(id => { if (!S.boutique.perso.some(d=>d.id===id)) list.push({id, nom:mp[id].n, m:mp[id].m||0, ancien:true}); });
  return list;
}
const salaireDuMois = m => Object.values(getM(m).perso||{}).reduce((a,d)=>a+(d.m||0),0);
function bilan(m){
  const debut = m+'-01', jours = getM(m).jours || {};
  const parJour = {};
  const rows = S.boutique.produits.map(p => {
    let e=0,v=0,tv=0,ta=0,av=0;
    Object.keys(jours).forEach(d => { const l = jours[d][p.id]; if(!l) return;
      e += l.e||0; v += l.v||0; av += (l.e||0)*(l.pa||0); tv += (l.v||0)*(l.pv||0); ta += (l.v||0)*(l.pa||0);
      parJour[d] = (parJour[d]||0) + (l.v||0)*(l.pv||0);
    });
    const si = stockAvant(p.id, debut);
    return {p, si, e, v, sf: si+e-v, tv, ta, mb: tv-ta, av};
  }).filter(r => r.p.actif!==false || r.e || r.v);
  const ca = rows.reduce((a,r)=>a+r.tv,0), achat = rows.reduce((a,r)=>a+r.ta,0), mb = ca-achat;
  const charges = chargesDuMois(m), tc = charges.reduce((a,c)=>a+c.m,0);
  return {rows, ca, achat, mb, charges, tc, res: mb-tc, parJour};
}
function totalJour(d){
  const jours = getM(d.slice(0,7)).jours[d] || {}; let ca=0, mb=0, q=0;
  Object.values(jours).forEach(l => { ca += (l.v||0)*(l.pv||0); mb += (l.v||0)*((l.pv||0)-(l.pa||0)); q += l.v||0; });
  return {ca, mb, q};
}

/* ---------- Enregistrement ---------- */
const Store = {
  mode:'local', db:null, uid:null, timers:{}, chains:{}, dl:true,
  saveLocal(){ try { localStorage.setItem(LK, JSON.stringify(S)); } catch(e){} },
  touch(key){
    this.saveLocal();
    if (this.mode !== 'db') { setStatus('local'); return; }
    setStatus('saving');
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => this.push(key), 600);
  },
  push(key){
    const body = key==='boutique' ? S.boutique : key==='credits' ? S.credits : S.mois[key.slice(2)];
    if (!body || this.mode!=='db') return;
    const data = JSON.parse(JSON.stringify(body));
    const ref = this.db.doc('data/users/'+this.uid+'/'+key);
    this.chains[key] = (this.chains[key]||Promise.resolve())
      .then(() => ref.set(data))
      .then(() => setStatus('saved'), err => this.fail(err));
    return this.chains[key];
  },
  fail(err){
    const c = err && err.code;
    if (c === 'quota_exceeded') { setStatus('error'); toast("L'espace d'enregistrement est plein. Exportez une sauvegarde puis supprimez des mois anciens."); return; }
    if (c === 'unavailable' || c === 'resource_exhausted') { setStatus('error'); toast("Connexion difficile : vos saisies sont gardées sur cet appareil et seront renvoyées à la prochaine modification."); return; }
    this.mode = 'local'; setStatus('local');
    toast("Votre compte n'accepte pas l'enregistrement ici : les données restent sur cet appareil.");
  },
  pushAll(){ this.push('boutique'); this.push('credits'); Object.keys(S.mois).forEach(m => this.push('m-'+m)); },
  async wipe(){
    const keys = ['boutique', 'credits', ...Object.keys(S.mois).map(m=>'m-'+m)];
    S = { boutique: defaultBoutique(), mois:{}, credits:{tiers:[], dettes:[]} };
    this.saveLocal();
    if (this.mode==='db') { try { await Promise.all(keys.map(k => this.db.doc('data/users/'+this.uid+'/'+k).delete())); setStatus('saved'); } catch(e){ this.fail(e); } }
  }
};

function onJourInput(card){
  const pid = card.dataset.pid, p = prod(pid), d = U.date, m = d.slice(0,7);
  const cq = creditQty(d,pid,'vente'), ce = creditQty(d,pid,'stock');
  const e = int(card.querySelector('[data-f="e"]').value) + ce, v = int(card.querySelector('[data-f="v"]').value) + cq;
  const dispo = stockAvant(pid, d);
  const errEl = card.querySelector('[data-o="err"]');
  const M = useM(m); M.jours[d] = M.jours[d] || {};
  const old = M.jours[d][pid] ? {...M.jours[d][pid]} : null;
  const apply = (ee, vv) => {
    if (!ee && !vv) { delete M.jours[d][pid]; if (!Object.keys(M.jours[d]).length) delete M.jours[d]; }
    else { const l = M.jours[d][pid] || {pv:p.pv, pa:p.pa}; l.e = ee; l.v = vv; M.jours[d][pid] = l; }
  };
  const restore = () => { M.jours[d] = M.jours[d] || {}; if (old) M.jours[d][pid] = old; else apply(0,0); };
  let err = '';
  if (v > dispo + e) {
    err = `Stock insuffisant : vous n'avez que ${fmt(dispo+e)} ${p.nom} (stock du matin + entrées)${cq?`, dont ${fmt(cq)} déjà vendu(s) à crédit`:''}. Ajoutez l'entrée de stock ou corrigez la quantité vendue.`;
    apply(e, Math.min(old ? old.v||0 : 0, dispo+e));
  } else apply(e, v);
  const neg = premierNegatif(pid);
  if (neg) { restore(); err = `Impossible : le stock de ${p.nom} deviendrait négatif le ${court(neg)}. Corrigez d'abord ce jour-là.`; }
  errEl.hidden = !err; errEl.textContent = err;
  card.classList.toggle('err', !!err);
  const l = ligne(d,pid) || {e:0,v:0};
  const pv = l.pv!=null?l.pv:p.pv, pa = l.pa!=null?l.pa:p.pa;
  card.classList.toggle('has', !!(l.e||l.v));
  card.querySelector('[data-o="tv"]').textContent = F((l.v||0)*pv);
  card.querySelector('[data-o="mb"]').textContent = F((l.v||0)*(pv-pa));

  Store.touch('m-'+m);
}

function chartJours(m, pj){
  const n = nbJours(m), W = 400, H = 180, L = 40, B = 22, T = 10;
  const vals = Array.from({length:n},(_,i)=>pj[m+'-'+pad(i+1)]||0);
  const max = Math.max(...vals, 1);
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const bw = (W-L-6)/n, y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires par jour en ${esc(libMois(m))}">`;
  for (let g=0; g<=top; g+=step){ s += `<line class="grid" x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${kfmt(g)}</text>`; }
  const td = today();
  vals.forEach((v,i)=>{ const x = L + i*bw + bw*0.15, h = (H-T-B)*(v/top); const d = m+'-'+pad(i+1);
    if (v>0) s += `<rect class="bar ${d===td?'today':''}" x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${court(d)} : ${F(v)}</title></rect>`;
    if (i===0 || (i+1)%5===0) s += `<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`;

}
function chartMois(m){

  const vals = ms.map(x => bilan(x).res);

  const mx = Math.max(...vals.map(Math.abs), 1), step = niceStep(mx);
  const hi = Math.max(0, Math.ceil(Math.max(...vals)/step)*step), lo = Math.min(0, Math.floor(Math.min(...vals)/step)*step);
  const top = hi===lo ? step : hi, span = (top - lo) || step;

  for (let g=lo; g<=top; g+=step){ s += `<line class="${g===0?'zero':'grid'}" x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${kfmt(g)}</text>`; }
  const bw = (W-L-6)/6;

    if (v) s += `<rect class="bar ${v<0?'neg':''}" x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw*0.5).toFixed(1)}" height="${Math.abs(y1-y0).toFixed(1)}" rx="2"><title>${esc(libMois(ms[i]))} : ${F(v)}</title></rect>`;

function periodeSyn(){
  const cur = today().slice(0,7), y = cur.slice(0,4), p = U.syn.p;
  if (p==='mois') return {de:cur, a:cur, lib:'Mois de '+libMois(cur)};
  if (p==='trim') return {de:addMonth(cur,-2), a:cur, lib:'Les 3 derniers mois ('+libMois(addMonth(cur,-2))+' à '+libMois(cur)+')'};
  if (p==='an-1') { const py = String(+y-1); return {de:py+'-01', a:py+'-12', lib:'Année '+py}; }
  if (p==='perso') { let de = U.syn.de || addMonth(cur,-5), a = U.syn.a || cur; if (de>a) [de,a] = [a,de]; return {de, a, lib: de===a ? 'Mois de '+libMois(de) : 'De '+libMois(de)+' à '+libMois(a)}; }

function synthese(de,a){
  const ms = moisEntre(de,a).map(m => ({m, b:bilan(m)}));
  const tot = {ca:0, achat:0, mb:0, tc:0, res:0};
  ms.forEach(x => { for (const k in tot) tot[k] += x.b[k]; });
  const actifs = ms.filter(x => x.b.ca || x.b.tc);
  const best = actifs.length ? actifs.reduce((p,x) => x.b.res > p.b.res ? x : p) : null;
  const worst = actifs.length ? actifs.reduce((p,x) => x.b.res < p.b.res ? x : p) : null;
  const prods = {};
  ms.forEach(x => x.b.rows.forEach(r => { const o = prods[r.p.id] || (prods[r.p.id] = {nom:r.p.nom, u:UN(r.p), v:0, tv:0, mb:0}); o.v += r.v; o.tv += r.tv; o.mb += r.mb; }));
  const top = Object.values(prods).filter(p => p.v).sort((x,y) => y.mb - x.mb);
  const ch = [], chIdx = {};
  ms.forEach(x => x.b.charges.forEach(c => { if (!c.m) return; if (!(c.nom in chIdx)) { chIdx[c.nom] = ch.length; ch.push({nom:c.nom, m:0, auto:!!c.auto}); } ch[chIdx[c.nom]].m += c.m; }));
  const perso = {};
  ms.forEach(x => persoDuMois(x.m).forEach(d => { if (d.m) perso[d.nom] = (perso[d.nom]||0) + d.m; }));

  const ds = CR().dettes.filter(d => d.tiers===t.id).sort((a,b) => a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);

}

  let client = 0, fourn = 0, retardC = 0, retardF = 0;
  CR().tiers.forEach(t => { const e = etatTiers(t); if (t.type==='client') { client += e.solde; if (e.retard) retardC++; } else { fourn += e.solde; if (e.retard) retardF++; } });
  return {client, fourn, retardC, retardF};
}
function objet(d){
  const parts = [];
  if (d.lignes && d.lignes.length) parts.push(d.lignes.map(l => { const p = prod(l.pid); return p ? (UN(p)==='pièce' ? fmt(l.q)+' '+p.nom : fmt(l.q)+' '+UN(p)+' de '+p.nom) : fmt(l.q)+' (produit supprimé)'; }).join(', '));

function chargesCredit(m){ const out = {}; CR().dettes.forEach(x => { if (x.kind==='charge' && x.date.slice(0,7)===m) { const o = out[x.cid] || (out[x.cid] = {m:0, nom:x.cnom}); o.m += x.m; } }); return out; }
/* Applique (+1) ou retire (−1) les produits d'un crédit dans les lignes du jour */
function applyLignes(det, sign){
  const f = det.kind==='vente' ? 'v' : 'e', m = det.date.slice(0,7), M = useM(m);
  M.jours[det.date] = M.jours[det.date] || {};
  det.lignes.forEach(l => { let L = M.jours[det.date][l.pid];
    if (!L) { L = {e:0, v:0, pv:l.pv, pa:l.pa}; M.jours[det.date][l.pid] = L; }
    L[f] = Math.max(0, (L[f]||0) + sign*l.q);
    if (!L.e && !L.v) delete M.jours[det.date][l.pid]; });
  if (!Object.keys(M.jours[det.date]).length) delete M.jours[det.date];
  Store.touch('m-'+m);
}
/* Crée un crédit relié à l'activité. Renvoie {err} ou {det}. */
function creerDette(sp){
  const C = CR(), t = tiersDe(sp.tiers); if (!t) return {err:'Choisissez le '+(sp.kind==='vente'?'client':'fournisseur')+'.'};
  const date = sp.date > today() ? today() : sp.date;
  const det = {id:uid('d'), ts:Date.now()+Math.random(), tiers:t.id, kind:sp.kind, date, ref:sp.ref||'', ech:sp.ech||'', note:sp.note||'', sig:'', paiements:[]};
  if (sp.kind==='charge') {
    const c = S.boutique.charges.find(x => x.id===sp.cid); if (!c) return {err:'Choisissez la charge.'};
    if (!sp.m) return {err:'Indiquez le montant.'};
    Object.assign(det, {cid:c.id, cnom:c.nom, m:sp.m});
  } else {
    const q = {}; (sp.lignes||[]).forEach(l => { if (l.q > 0) q[l.pid] = (q[l.pid]||0) + l.q; });
    const pids = Object.keys(q); if (!pids.length) return {err:'Indiquez au moins un produit et sa quantité.'};
    det.lignes = pids.map(pid => { const p = prod(pid), L = ligne(date, pid); return {pid, q:q[pid], pv: L && L.pv!=null ? L.pv : p.pv, pa: L && L.pa!=null ? L.pa : p.pa}; });
    if (sp.kind==='vente') for (const l of det.lignes) { const L = ligne(date, l.pid) || {e:0, v:0}, dispo = stockAvant(l.pid, date) + (L.e||0) - (L.v||0);
      if (l.q > dispo) return {err:`Stock insuffisant pour ${prod(l.pid).nom} le ${court(date)} : ${fmt(Math.max(0,dispo))} disponible(s).`}; }
    det.m = det.lignes.reduce((a,l) => a + l.q*(sp.kind==='vente' ? l.pv : l.pa), 0);
    applyLignes(det, 1);
    const neg = det.lignes.map(l => premierNegatif(l.pid)).find(Boolean);
    if (neg) { applyLignes(det, -1); return {err:`Impossible : le stock deviendrait négatif le ${court(neg)}.`}; }
  }
  C.dettes.push(det); Store.touch('credits');
  return {det};
}
function supprimerDette(det){
  if (det.lignes && det.lignes.length && (det.kind==='vente' || det.kind==='stock')) {
    applyLignes(det, -1);
    const neg = det.lignes.map(l => premierNegatif(l.pid)).find(Boolean);
    if (neg) { applyLignes(det, 1); return `Impossible : ce stock a déjà été vendu (le stock deviendrait négatif le ${court(neg)}). Corrigez d'abord les ventes.`; }
  }
  CR().dettes = CR().dettes.filter(d => d.id!==det.id); Store.touch('credits');

}

let sigDirty = false;
function crAfterRender(){
  const c = document.getElementById('sigc'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  const g = c.getContext('2d'); g.scale(dpr,dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#14202a';
  let down = false, last = null; sigDirty = false;
  const pos = ev => { const b = c.getBoundingClientRect(); return [ev.clientX-b.left, ev.clientY-b.top]; };
  c.onpointerdown = ev => { down = true; last = pos(ev); try { c.setPointerCapture(ev.pointerId); } catch(_){} ev.preventDefault(); };
  c.onpointermove = ev => { if (!down) return; const p = pos(ev); g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last = p; sigDirty = true; ev.preventDefault(); };
  c.onpointerup = c.onpointercancel = () => { down = false; };
  c.scrollIntoView({block:'center'});
}
function sigExport(){
  const c = document.getElementById('sigc'), o = document.createElement('canvas'); o.width = 300; o.height = Math.round(300*c.height/c.width);
  const g = o.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,o.width,o.height); g.drawImage(c,0,0,o.width,o.height);
  return o.toDataURL('image/jpeg', .7);
}

}

const TR = () => { const C = CR(); if (!C.tresor) C.tresor = {initial:0, mouv:[]}; if (!Array.isArray(C.tresor.mouv)) C.tresor.mouv = []; return C.tresor; };
const CAT = {
  apport:{s:1, nom:"Apport personnel de l'entrepreneur"},
  banque_e:{s:1, nom:"Argent pris sur le compte bancaire ou l'épargne"},
  act_e:{s:1, nom:"Apport venant d'une autre activité"},

  rpret:{s:1, nom:"Remboursement reçu d'un prêt accordé"},
  autre_e:{s:1, nom:"Autre entrée d'argent"},
  banque_s:{s:-1, nom:"Versement à la banque ou à l'épargne"},
  act_s:{s:-1, nom:'Argent donné à une autre activité'},
  pret_s:{s:-1, nom:"Prêt accordé à quelqu'un"},
  don:{s:-1, nom:'Don ou aide (famille, cérémonie…)'},
  remb:{s:-1, nom:'Remboursement de prêt'}, inv:{s:-1, nom:"Achat de matériel ou d'équipement"},
  retrait:{s:-1, nom:'Retrait personnel (en plus du salaire)'}, autre_s:{s:-1, nom:"Autre sortie d'argent"}
};
const sgn = n => (n<0?'−':n>0?'+':'')+F(Math.abs(n));
function caisse(de, a){
  let ca = 0, cv = 0, achats = 0, tc = 0;
  moisEntre(de, a).forEach(m => { const b = bilan(m); ca += b.ca; cv += b.achat; achats += b.rows.reduce((s,r) => s+(r.av||0), 0); tc += b.tc; });
  const d0 = de+'-01', d1 = a+'-31';
  let vc = 0, recu = 0, ac = 0, cc = 0, paye = 0;
  CR().dettes.forEach(x => { const t = tiersDe(x.tiers); if (!t) return; const inP = x.date>=d0 && x.date<=d1;
    const pays = (x.paiements||[]).filter(p => p.date>=d0 && p.date<=d1).reduce((s,p) => s+p.m, 0);
    if (t.type==='client') { if (inP) vc += x.m; recu += pays; }
    else { if (inP) { if (x.kind==='charge') cc += x.m; else ac += x.m; } paye += pays; } });
  let ae = 0, as = 0; const det = {};
  TR().mouv.forEach(x => { if (x.date<d0 || x.date>d1) return; const c = CAT[x.cat] || {s:1}; if (c.s>0) ae += x.m; else as += x.m; det[x.cat] = (det[x.cat]||0) + x.m; });
  const comptant = ca - vc, achatsComptant = achats - ac, chargesComptant = tc - cc;
  const entree = comptant + recu + ae, sortie = achatsComptant + chargesComptant + paye + as;
  return {ca, cv, res: ca - cv - tc, vc, recu, comptant, ae, entree, achats, ac, achatsComptant, tc, cc, chargesComptant, paye, as, sortie, flux: entree - sortie, det,
    // compatibilité avec l'ancien panneau
    venteCredit: vc, stockCredit: ac, chargeCredit: cc, solde: entree - sortie};
}
function premierMois(){
  let m = today().slice(0,7);
  Object.keys(S.mois).forEach(x => { if (x < m) m = x; });
  CR().dettes.forEach(d => { if (d.date.slice(0,7) < m) m = d.date.slice(0,7); (d.paiements||[]).forEach(p => { if (p.date.slice(0,7) < m) m = p.date.slice(0,7); }); });
  TR().mouv.forEach(v => { if (v.date.slice(0,7) < m) m = v.date.slice(0,7); });
  return m;
}

/* ---------- Vue : Ratios d'analyse financière ---------- */
const pct = v => (Math.round(v*1000)/10).toLocaleString('fr-FR')+' %';
const dec = (v, n=2) => v.toLocaleString('fr-FR',{minimumFractionDigits:n, maximumFractionDigits:n});
const VOY = {g:['Bon','pos'], o:['À surveiller','mid'], r:['Attention','neg'], n:['Pour info','']};
/* Classe une valeur : haut = true si une valeur élevée est bonne. s = [seuil bon, seuil acceptable] */
const niveau = (v, s, haut) => haut ? (v >= s[0] ? 'g' : v >= s[1] ? 'o' : 'r') : (v <= s[0] ? 'g' : v <= s[1] ? 'o' : 'r');
function encours(type, d1){
  let s = 0;
  CR().dettes.forEach(x => { const t = tiersDe(x.tiers); if (!t || t.type!==type || x.date > d1) return;
    const p = (x.paiements||[]).filter(y => y.date <= d1).reduce((a,y)=>a+y.m,0); s += Math.max(0, x.m - p); });
  return s;
}
function ratiosMois(m){
  const b = bilan(m), k = caisse(m, m), cur = today().slice(0,7);
  const d0 = m+'-01', d1 = m+'-'+String(nbJours(m)).padStart(2,'0');
  const je = m===cur ? Math.max(1, +today().slice(8)) : nbJours(m);
  const sal = salaireDuMois(m), loyer = b.charges.filter(c => estLoyer(S.boutique.charges.find(x=>x.id===c.id))).reduce((a,c)=>a+c.m,0);
  const stockVal = b.rows.reduce((a,r)=>a+Math.max(0,r.sf)*(r.p.pa||0),0);
  const jours = getM(m).jours || {}, mbJ = {};
  Object.keys(jours).forEach(d => Object.values(jours[d]).forEach(l => { mbJ[d] = (mbJ[d]||0) + (l.v||0)*((l.pv||0)-(l.pa||0)); }));
  let cum = 0, pm = null; Object.keys(mbJ).sort().forEach(d => { if (pm) return; cum += mbJ[d]; if (b.tc > 0 && cum >= b.tc) pm = d; });
  const joursVente = Object.keys(b.parJour).filter(d => b.parJour[d] > 0).length;
  const eC = encours('client', d1), eF = encours('fournisseur', d1);
  let du = 0, recu = 0;
  CR().dettes.forEach(x => { const t = tiersDe(x.tiers); if (!t || t.type!=='client') return;
    const echu = x.ech ? x.ech <= d1 : addDay(x.date, 30) <= d1; if (!echu) return;
    du += x.m; recu += (x.paiements||[]).filter(y => y.date <= d1).reduce((a,y)=>a+y.m,0); });
  const s0 = soldeDebut(m), s1 = s0 + k.flux;
  return {b, k, je, sal, loyer, stockVal, pm, joursVente, eC, eF, du, recu, s1, tauxMB: b.ca ? b.mb/b.ca : 0, d1};
}
function vRatios(){
  const m = U.mois; let h = demoBanner() + navMois();
  if (!S.boutique.produits.length) return h + `<div class="empty"><h3>Pas encore de ratios</h3><p>Les ratios se calculent tout seuls à partir de vos ventes, achats, charges et crédits.</p><div class="row" style="justify-content:center"><button class="btn" data-act="goto" data-tab="produits">Ajouter mes produits</button><button class="btn ghost" data-act="demo">Voir un exemple</button></div></div>`;
  const R = ratiosMois(m), b = R.b, k = R.k;
  if (!b.ca && !b.tc) return h + `<div class="empty"><h3>Rien pour ${esc(libMois(m))}</h3><p>Notez des ventes et des charges ce mois-ci pour voir les ratios.</p></div>`;

  const card = (nom, val, nv, phrase, calc) => `<div class="ratio ${VOY[nv][1]}"><div class="ratio-h"><span class="ratio-n">${nom}</span><span class="chip ${VOY[nv][1]}">${VOY[nv][0]}</span></div>

    card('Taux de résultat', pct(tRes), niveau(tRes,[.05,0],true), b.res >= 0 ? `Sur 100 F vendus, il reste <b>${fmt(tRes*100)} F</b> de bénéfice après toutes les charges.` : `La boutique perd <b>${fmt(-tRes*100)} F</b> sur 100 F vendus : les charges dépassent la marge.`, `Résultat ${sgn(b.res)} ÷ ventes ${F(b.ca)}`),
    card('Poids des charges', pct(poids), b.mb > 0 ? niveau(mange,[.7,1],false) : 'r', `Les charges prennent <b>${fmt(Math.min(mange,9.99)*100)} %</b> de la marge.${R.loyer ? ` Le loyer pèse ${pct(b.ca ? R.loyer/b.ca : 0)} des ventes.` : ''}`, `Charges ${F(b.tc)} ÷ ventes ${F(b.ca)} · charges ÷ marge brute`),
    card("Salaire de l'entrepreneur / bénéfice", avantSal > 0 ? pct(sr) : '—', avantSal > 0 ? niveau(sr,[.8,1],false) : 'r', avantSal > 0 ? (sr <= 1 ? `Vous prenez <b>${fmt(sr*100)} %</b> de ce que la boutique gagne. ${sr<=.8?'Il reste de quoi renforcer le stock.':'Il ne reste presque rien pour la boutique.'}` : `Vous prenez <b>${F(R.sal-avantSal)}</b> de plus que ce que la boutique gagne : c'est le capital qui diminue.`) : `La boutique n'a rien gagné avant votre salaire : ${F(R.sal)} de dépenses personnelles sont pris sur le capital.`, `Dépenses personnelles ${F(R.sal)} ÷ bénéfice avant salaire ${sgn(avantSal)}`)

    card('Point mort', R.pm ? 'le '+court(R.pm) : 'pas atteint', R.pm ? (+R.pm.slice(8) <= 20 ? 'g' : 'o') : 'r', R.pm ? `À partir du <b>${+R.pm.slice(8)} ${MOIS[+m.slice(5)-1]}</b>, la boutique a couvert ses charges : le reste du mois, c'est du bénéfice.` : `Il manque <b>${F(manque)}</b> de marge, soit environ <b>${F(R.tauxMB ? manque/R.tauxMB : 0)}</b> de ventes.`, 'Jour où la marge cumulée dépasse les charges du mois')

  /* 3. Stock, clients, fournisseurs */

    card('Délai clients', dCli==null ? '—' : fmt(dCli)+' jours', dCli==null ? 'n' : niveau(dCli,[15,30],false), dCli==null ? (R.eC ? `Pas de nouvelle vente à crédit ce mois, mais ${F(R.eC)} restent à recouvrer.` : 'Aucune vente à crédit.') : `Les clients mettent environ <b>${fmt(dCli)} jours</b> à payer.`, `Créances en cours ${F(R.eC)} ÷ ventes à crédit par jour`),
    card('Taux de recouvrement', tRec==null ? '—' : pct(tRec), tRec==null ? 'n' : niveau(tRec,[.8,.6],true), tRec==null ? "Aucun crédit client arrivé à échéance." : `Sur 100 F que les clients devaient déjà avoir payés, <b>${fmt(tRec*100)} F</b> sont rentrés.`, `Sommes reçues ${F(R.recu)} ÷ sommes dues ${F(R.du)} (crédits échus)`),

/* ---------- Exemple (repris de votre tableau, chiffres cohérents) ---------- */
function chargerExemple(){
  const P = [
    ['Pastille de gingembre',100,80,400,120,30],
    ['Sucre en morceaux',500,400,60,15,10],
    ['Savon de ménage',250,200,80,20,15],
    ['Lait concentré',400,325,48,12,10],
    ['Riz parfumé',650,550,150,50,25],
    ['Huile de palme',1300,1100,40,12,8]
  ];
  const b = defaultBoutique(); b.nom = 'Boutique exemple'; b.exemple = true;
  const UX = ['sachet','boîte','pièce','boîte','kg','L'];
  b.produits = P.map((x,i)=>({id:'p'+(i+1), nom:x[0], pv:x[1], pa:x[2], si:x[3], seuil:x[5], u:UX[i], actif:true}));
  S = {boutique:b, mois:{}, credits:{tiers:[], dettes:[]}};
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const t = today(); let d = addMonth(t.slice(0,7),-1)+'-01';
  const stock = {}; b.produits.forEach(p=>stock[p.id]=p.si);
  while (d < t) {
    const M = useM(d.slice(0,7)); const J = M.jours[d] = {};
    const dim = new Date(d+'T12:00:00').getDay()===0;
    b.produits.forEach((p,i) => {
      const moy = P[i][4]*(dim?0.5:1); let e = 0;
      if (stock[p.id] < moy*2) e = Math.round(moy*6/5)*5;
      let v = Math.max(0, Math.round(moy*(0.7+rnd()*0.6)));
      v = Math.min(v, stock[p.id]+e);
      stock[p.id] += e - v;
      if (e||v) J[p.id] = {e, v, pv:p.pv, pa:p.pa};
    });
    const cid = n => b.charges.find(c => c.nom===n).id, dj = [];
    if (!dim) { dj.push({cid:cid('Transport'), m:[500,1000,1500][Math.floor(rnd()*3)], note:'Taxi marché'}); dj.push({cid:cid('Ticket de marché / taxe du jour'), m:200, note:''}); }
    if (rnd() < .35) dj.push({cid:cid('Téléphone'), m:500, note:'Crédit de communication'});
    if (rnd() < .15) dj.push({cid:cid('Emballages (sachets, papier)'), m:1000, note:'Sachets'});
    if (dj.length) { M.depj = M.depj || {}; M.depj[d] = dj.map((x,k) => ({id:'j'+d.replace(/-/g,'')+k, cid:x.cid, cnom:b.charges.find(c=>c.id===x.cid).nom, m:x.m, note:x.note})); }
    d = addDay(d,1);
  }
  const ch = {c1:30000, c2:15000, c4:10000, c6:5000};
  const dp = {d1:90000, d2:40000, d3:25000, d4:10000, d5:15000, d6:10000, d7:5000, d8:5000};
  [addMonth(t.slice(0,7),-1), t.slice(0,7)].forEach(m => { const M = useM(m);
    const jours = {c1:String(nbJours(m)).padStart(2,'0'), c2:'10', c4:'30', c6:'15'}; M.depj = M.depj || {};
    Object.keys(ch).forEach(id => { const d = m+'-'+jours[id]; if (d >= t) return; (M.depj[d] = M.depj[d] || []).push({id:'x'+m.replace('-','')+id, cid:id, cnom:b.charges.find(c=>c.id===id).nom, m:ch[id], note:id==='c1'?'Loyer du mois':'', loyer:id==='c1'||undefined, date:d}); });
    Object.keys(dp).forEach(id => M.perso[id] = {n:b.perso.find(d=>d.id===id).nom, m:dp[id]}); });
  exempleCredits();
  Store.saveLocal(); if (Store.mode==='db') Store.pushAll();
  toast("Exemple chargé : 6 produits et 6 semaines de ventes.");
}

async function exportCSV(){
  const m = U.mois, b = bilan(m), sep = ';';
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';
  const L = [[q(S.boutique.nom)], [q('Bilan de '+libMois(m))], [],
    ['N°','Produit','Stock début','Entrées','Qté vendue','Stock fin','PU vente','PU achat','Total vente','Total achat','Marge brute'].map(q)];
  b.rows.forEach((r,i)=>L.push([i+1, q(r.p.nom+' ('+UN(r.p)+')'), r.si, r.e, r.v, r.sf, r.p.pv, r.p.pa, r.tv, r.ta, r.mb]));
  L.push(['', q('Total'), '', '', '', '', '', '', b.ca, b.achat, b.mb], [], [q('Charges'), q('Montant')]);
  b.charges.filter(c=>c.m).forEach(c => { L.push([q(c.nom), c.m]); if (c.auto) persoDuMois(m).filter(d=>d.m).forEach(d => L.push([q('   dont '+d.nom), d.m])); });
  L.push([q('Total des charges'), b.tc], [], [q("Chiffre d'affaires"), b.ca], [q('Marge brute'), b.mb], [q('Total des charges'), b.tc], [q(b.res>=0?'Résultat (bénéfice)':'Résultat (déficit)'), b.res]);
  { const tc = totauxCredits(); L.push([], [q('Crédits en cours au '+today().split('-').reverse().join('/'))], [q('Mes clients me doivent'), tc.client], [q('Je dois à mes fournisseurs'), tc.fourn]); }
  { const k = caisse(m, m), s0 = soldeDebut(m); L.push([], [q('Trésorerie')], [q('Argent disponible au début'), s0], [q('Total des encaissements'), k.entree], [q('Total des décaissements'), k.sortie], [q('Argent disponible à la fin'), s0 + k.flux], [q("Résultat de l'activité"), k.res]); }
  if (LIC) L.push([], [q('Licence n° '+LIC.d.serial+' accordée à '+LIC.d.client+(LIC.d.boutique?' — '+LIC.d.boutique:'')+(LIC.d.ville?', '+LIC.d.ville:''))]);
  await save('bilan-'+m+'.csv', '﻿'+L.map(r=>r.join(sep)).join('\r\n'));
}
async function save(filename, data){
  try {
    const blob = new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Fichier téléchargé : '+filename);
  } catch(e){ toast("Le téléchargement n'a pas pu se faire sur cet appareil."); }
}

    <textarea class="in" id="f-actcode" placeholder="Collez ici le code reçu (il commence par CB1-)"></textarea>
    <p class="msg bad" id="act-err" hidden style="margin-top:8px"></p>
    <div class="row" style="margin-top:10px"><button class="btn" type="submit" id="b-act">Activer</button></div>
  </form>`;
  return h;
}
function activer(){
  const code = $('#f-actcode').value.trim(), err = $('#act-err');
  const a = code && lireCode(code);
  if (!a) { err.textContent = "Ce code ne correspond pas à ce téléphone ou à cette licence. Vérifiez que vous avez copié tout le code, ou redemandez-le en envoyant le code appareil " + fmtDev(Lic.device) + "."; err.hidden = false; return; }
  if (!a.illimite && a.until < today()) { err.textContent = "Ce code est valable jusqu'au "+court(a.until)+'/'+a.until.slice(0,4)+" : il a déjà expiré. Demandez un nouveau code."; err.hidden = false; return; }
  try { localStorage.setItem('cb-code-'+SERIAL, code.replace(/\s+/g,'')); } catch(e){}
  computeLic(); U.tab = 'jour'; render();
  toast(a.illimite ? 'Licence activée, sans limite de durée.' : 'Licence activée jusqu\'au '+court(a.until)+'/'+a.until.slice(0,4)+'.');
}
function copier(txt){
  const done = () => toast('Copié.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copié.'); } catch(e){ toast('Sélectionnez le texte pour le copier.'); } ta.remove(); }
function licAct(a){
  if (a==='lic-open') { U.tab='licence'; render(); window.scrollTo(0,0); return true; }
  if (a==='lic-copy-dev') { copier(fmtDev(Lic.device)); return true; }
  if (a==='lic-copy-msg') { copier(messageActivation()); return true; }
  return false;
}
// Revérifie la licence quand on revient sur l'application (passage de minuit, etc.)
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const before = Lic.state; computeLic(); if (Lic.state !== before) render(); } });

/* Lien reçu : n'est adopté que si sa signature est valable (un faux lien ne remplace pas une vraie licence) */
let lienRefuse = false;
(function(){
  let c = null; try { c = localStorage.getItem('cb-lic-new'); localStorage.removeItem('cb-lic-new'); } catch(e){}
  if (!c) return;
  try { const o = JSON.parse(c);
    if (o && o.d && o.s && Ed.verify(utf8('LIC|'+JSON.stringify(o.d)), b64d(o.s), b64d(PUB))) {
      localStorage.setItem('cb-lic', c); LIC = o; SERIAL = o.d.serial; LK = 'cahier-boutique-' + SERIAL;
    } else lienRefuse = true;
  } catch(e){ lienRefuse = true; }
})();
if (lienRefuse) setTimeout(() => toast("Ce lien n'est pas valable : il a été modifié ou ne vient pas de votre fournisseur."), 300);
/* ---------- Version en ligne : accueil sans licence, installation ---------- */
function lireLienLicence(txt){
  const t = String(txt||'').trim(); let raw = null;
  const m = t.match(/[?&]l=([A-Za-z0-9_-]+)/); if (m) raw = m[1]; else if (/^[A-Za-z0-9_-]{40,}$/.test(t)) raw = t;
  if (!raw) return null;
  try { const o = JSON.parse(new TextDecoder().decode(b64d(raw)));
    if (!o || !o.d || !o.s) return null;
    return Ed.verify(utf8('LIC|'+JSON.stringify(o.d)), b64d(o.s), b64d(PUB)) ? o : null;
  } catch(e){ return null; }
}
function renderWelcome(){
  $('#licbar').hidden = true;
  document.querySelector('.tabs').hidden = true;
  $('#app').innerHTML = `<div class="view">
    <div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 16px">
      <div class="logo" style="width:64px;height:64px;border-radius:16px"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12.5a1 1 0 0 1-1 .9h-11a1 1 0 0 1-1-.9z"/><path d="M8.5 7a3.5 3.5 0 0 1 7 0"/><path d="M9 13h6"/></svg></div>
      <h2 style="font-size:1.5rem">Bienvenue dans Cahier de Boutique</h2>
      <p class="hint" style="margin:0;max-width:40ch">Pour commencer, ouvrez le <b>lien personnel</b> que votre fournisseur vous a envoyé par WhatsApp. Vous pouvez aussi le coller ci-dessous.</p>
    </div>
    <form class="panel" id="f-welcome" data-free>
      <label class="fld" for="w-l">Lien ou code reçu</label>
      <textarea class="in" id="w-l" placeholder="Collez ici le lien qui commence par https://"></textarea>
      <p class="msg bad" id="w-err" hidden style="margin-top:8px"></p>
      <div class="row" style="margin-top:10px"><button class="btn" type="submit">Ouvrir mon application</button></div>
    </form></div>`;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'f-welcome') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const o = lireLienLicence($('#w-l').value);
  if (!o) { const er = $('#w-err'); er.textContent = "Ce lien n'est pas reconnu. Vérifiez que vous avez copié tout le lien envoyé par votre fournisseur."; er.hidden = false; return; }
  try { localStorage.setItem('cb-lic', JSON.stringify(o)); } catch(_){}
  location.replace(location.pathname);
}, true);
/* Bouton « Installer l'application » quand le téléphone le propose */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (typeof render === 'function' && LIC) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast("Application installée : retrouvez l'icône Cahier sur votre écran d'accueil."); });
const estInstallee = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function blocInstall(){
  if (estInstallee()) return '';
  return `<div class="panel install"><b>Mettre l'application sur l'écran d'accueil</b>
    ${installEvt ? '<div class="row"><button class="btn" data-act="install">Installer l\'application</button></div>' : ''}
    <p class="hint" style="margin:0">${installEvt ? 'Ou bien : ' : ''}dans Chrome, touchez le menu <b>⋮</b> puis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>. Sur Samsung Internet, touchez <b>☰</b> puis <b>« Ajouter page à »</b> → <b>« Écran d'accueil »</b>.</p></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act="install"]'); if (!t || !installEvt) return;
  e.stopImmediatePropagation(); installEvt.prompt(); try { await installEvt.userChoice; } catch(_){} installEvt = null; render();
}, true);
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }

loadLocal(); migrate(); computeLic(); render(); if (LIC) { ouvrirConseilDuJour(); renderConseil(); }
document.addEventListener('keydown', e => { if (e.key==='Escape' && U.conseil) { U.conseil = null; renderConseil(); } });
})();
